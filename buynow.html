<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buy Now — Signature Look</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-6 font-sans">

  <h2 class="text-2xl font-bold mb-6">Checkout</h2>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Billing -->
    <div class="bg-white shadow rounded-xl p-6">
      <h3 class="text-xl font-semibold mb-4">Billing Details</h3>

      <form>
        <input class="w-full border rounded-md p-2 mb-4" placeholder="Full Name" />
        <input class="w-full border rounded-md p-2 mb-4" placeholder="Phone" />
        <textarea class="w-full border rounded-md p-2 mb-4" placeholder="Address"></textarea>
        <input class="w-full border rounded-md p-2 mb-4" placeholder="Pincode" />

        <select class="w-full border rounded-md p-2 mb-4">
          <option>Cash on Delivery</option>
          <option>UPI</option>
          <option>Credit/Debit Card</option>
        </select>

        <button class="w-full bg-indigo-600 text-white py-3 rounded-md text-lg font-semibold">
          Place Order
        </button>
      </form>
    </div>

    <!-- Summary -->
    <div class="bg-white shadow rounded-xl p-6">
      <h3 class="text-xl font-semibold mb-4">Order Summary</h3>

      <p class="text-lg font-semibold text-right">Total: ₹2,698</p>
    </div>

  </div>

</body>
</html>
