<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Signature Look</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f8f8f8;
    }

    header{
      width:100%;
      padding:12px 30px;
      background:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      position:sticky;
      top:0;
      z-index:10;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    .header-icons i{
      font-size:22px;
      margin-left:18px;
      cursor:pointer;
    }

    .page-title{
      max-width:1200px;
      margin:30px auto;
      padding:0 20px;
      font-size:30px;
      font-weight:bold;
    }

    .shop-container{
      display:grid;
      grid-template-columns:250px 1fr;
      max-width:1200px;
      margin:20px auto;
      gap:30px;
      padding:0 20px;
    }

    /* Sidebar */
    .filter-box{
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 3px 8px rgba(0,0,0,0.1);
      height:max-content;
    }

    .filter-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .filter-box label{
      display:block;
      margin-bottom:8px;
      font-size:16px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
      gap:25px;
    }

    .card{
      background:#fff;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 3px 8px rgba(0,0,0,0.15);
      position:relative;
      cursor:pointer;
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .wishlist-btn{
      position:absolute;
      top:10px;
      right:10px;
      background:#fff;
      width:35px;
      height:35px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-details{
      padding:15px;
    }

    .name{
      font-size:18px;
      font-weight:600;
      margin-bottom:6px;
    }

    .price{
      font-size:17px;
      color:#444;
    }

    footer{
      background:#000;
      color:#fff;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }
  </style>
  <style>
    .heart-btn{
      position:absolute;top:10px;right:10px;font-size:22px;cursor:pointer;color:#555;
    }
    .heart-btn.liked{ color:red; }
  </style>
</head>
<body>

<header>
  <div class="logo">Signature Look</div>
  <div class="header-icons">
    <i class="fa fa-search"></i>
    <i class="fa fa-heart"></i>
    <i class="fa fa-shopping-cart"></i>
  </div>
</header>

<div class="page-title">Shop</div>

<div class="shop-container">

  <div class="filter-box">
    <div class="filter-title">Filters</div>

    <label><input type="checkbox" /> Formal Shirts</label>
    <label><input type="checkbox" /> Casual Shirts</label>
    <label><input type="checkbox" /> Printed Shirts</label>
    <label><input type="checkbox" /> Solid Shirts</label>

    <br>
    <div class="filter-title">Price</div>
    <label><input type="checkbox" /> Under ₹799</label>
    <label><input type="checkbox" /> ₹800 – ₹1299</label>
    <label><input type="checkbox" /> ₹1300 – ₹1999</label>
  </div>

  <div class="products">

    <div class="card">
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1593032457860-9d566d2a5f06?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Black Classic Shirt</div>
        <div class="price">₹999</div>
      </div>
    </div>

    <div class="card">
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Blue Premium Shirt</div>
        <div class="price">₹1299</div>
      </div>
    </div>

    <div class="card">
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Luxury White Shirt</div>
        <div class="price">₹1199</div>
      </div>
    </div>

    <div class="card">
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1564859228273-274232fdb516?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Olive Green Shirt</div>
        <div class="price">₹1099</div>
      </div>
    </div>

  </div>
</div>

<footer>
  © 2025 Signature Look — All Rights Reserved
</footer>

  <!-- Wishlist Count Script -->
  <script>
    // Load wishlist from localStorage
    let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

    // Update header wishlist icon count
    function updateWishlistCount() {
        const icon = document.querySelector('#wishlist-count');
        if (icon) {
            icon.textContent = wishlist.length;
        }
    }

    // Toggle wishlist
    function toggleWishlist(id) {
        const index = wishlist.indexOf(id);

        if (index === -1) {
            wishlist.push(id);
        } else {
            wishlist.splice(index, 1);
        }

        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        refreshHearts();
        updateWishlistCount();
    }

    // Make heart red if in wishlist
    function refreshHearts() {
        document.querySelectorAll('.heart-btn').forEach(btn => {
            const id = btn.getAttribute('data-id');

            if (wishlist.includes(id)) {
                btn.classList.add('liked');
            } else {
                btn.classList.remove('liked');
            }
        });
    }

    // Run on page load
    refreshHearts();
    updateWishlistCount();
</script>

</body>
</html>
