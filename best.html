<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Sale — Signature Look</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f7f7f7;
    }

    header{
      width:100%;
      padding:12px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      position:sticky;
      top:0;
      z-index:10;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    .header-icons i{
      font-size:22px;
      margin-left:18px;
      cursor:pointer;
    }

    .banner{
      width:100%;
      height:270px;
      background:url('https://images.unsplash.com/photo-1521336575822-6da63fb45455?auto=format&fit=crop&w=1200&q=80') center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .banner h1{
      font-size:40px;
      color:#fff;
      background:rgba(0,0,0,0.5);
      padding:10px 25px;
      border-radius:8px;
    }

    .collection{
      max-width:1200px;
      margin:40px auto;
      padding:0 20px;
    }

    .collection-title{
      font-size:30px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .items{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
      gap:25px;
    }

    .card{
      background:#fff;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 3px 8px rgba(0,0,0,0.15);
      transition:0.3s;
      position:relative;
      cursor:pointer;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .sale-tag{
      position:absolute;
      top:10px;
      left:10px;
      background:red;
      color:#fff;
      padding:6px 10px;
      font-size:14px;
      border-radius:4px;
    }

    .wishlist-btn{
      position:absolute;
      top:10px;
      right:10px;
      background:#fff;
      width:35px;
      height:35px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      color:#333;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .card-details{
      padding:15px;
    }

    .name{
      font-size:18px;
      font-weight:600;
      margin-bottom:6px;
    }

    .price{
      font-size:16px;
      color:#333;
    }

    .old-price{
      text-decoration:line-through;
      color:#777;
      font-size:14px;
      margin-left:8px;
    }

    footer{
      background:#000;
      color:#fff;
      padding:20px;
      margin-top:40px;
      text-align:center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Signature Look</div>
  <div class="header-icons">
    <i class="fa fa-search"></i>
    <i class="fa fa-heart"></i>
    <i class="fa fa-shopping-cart"></i>
  </div>
</header>

<div class="banner">
  <h1>Best Sale</h1>
</div>

<section class="collection">
  <h2 class="collection-title">Top Selling Shirts</h2>

  <div class="items">

    <div class="card">
      <div class="sale-tag">-40%</div>
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Royal Blue Premium Shirt</div>
        <div class="price">₹899 <span class="old-price">₹1499</span></div>
      </div>
    </div>

    <div class="card">
      <div class="sale-tag">-35%</div>
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Black Luxury Shirt</div>
        <div class="price">₹999 <span class="old-price">₹1599</span></div>
      </div>
    </div>

    <div class="card">
      <div class="sale-tag">-50%</div>
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1530841124573-99b6ef3de958?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">White Cotton Shirt</div>
        <div class="price">₹749 <span class="old-price">₹1499</span></div>
      </div>
    </div>

    <div class="card">
      <div class="sale-tag">-45%</div>
      <div class="wishlist-btn"><i class="fa fa-heart-o"></i></div>
      <img src="https://images.unsplash.com/photo-1564859228273-274232fdb516?auto=format&fit=crop&w=500&q=80" />
      <div class="card-details">
        <div class="name">Olive Green Classic Shirt</div>
        <div class="price">₹899 <span class="old-price">₹1599</span></div>
      </div>
    </div>

  </div>
</section>

<footer>
  © 2025 Signature Look — All Rights Reserved
</footer>

</body>
</html>
